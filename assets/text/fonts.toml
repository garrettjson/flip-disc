# Fonts: each is a family of sizes of one typeface, drawn on the dot grid.
# Text asks for a height in dots and gets the size nearest to it (see
# flipdisc/fonts/font.py). Sizes are BDF files, relative to this directory;
# add one with flipdisc/fonts/importer.py. The default family is
# DEFAULT_FAMILY in flipdisc/fonts/loader.py.

[spleen]
# Spleen (BSD licence, spleen/LICENSE), and below its smallest size a 3x5
# hand-drawn for this display
sizes = [
    "spleen/3x5.bdf",
    "spleen/5x8.bdf",
    "spleen/6x12.bdf",
    "spleen/8x16.bdf",
    "spleen/12x24.bdf",
    "spleen/16x32.bdf",
    "spleen/32x64.bdf",
]

[x11]
# The X Window System's "fixed" terminal fonts (public domain, x11/COPYING)
sizes = [
    "x11/4x6.bdf",
    "x11/5x7.bdf",
    "x11/5x8.bdf",
    "x11/6x9.bdf",
    "x11/6x10.bdf",
    "x11/6x12.bdf",
    "x11/6x13.bdf",
    "x11/7x14.bdf",
    "x11/9x15.bdf",
    "x11/9x18.bdf",
    "x11/10x20.bdf",
]
