[display]
# Panel configuration - 28x28 canvas from two stacked AlfaZeta 14x28 panels,
# i.e. four controllers that each drive a strip 28 wide x 7 tall (see docs/hardware.md)
panel_type = "28x7"  # "7x7", "14x7", or "28x7"
columns = 1  # Number of panels horizontally (28*1 = 28)
rows = 4  # Number of panels vertically (7*4 = 28)
refresh_rate = 20.0  # Target FPS
buffer_duration = 1.0  # Frame buffer duration in seconds

[serial]
port = "/dev/ttyUSB0"
baudrate = 38400  # must match the DS#2 switches on every controller (docs/hardware.md §3)
timeout = 1.0
mock = true  # Set to false for real hardware

# Optional: auto-fetch weather and display on the "weather" animation
# Uncomment and fill in your coordinates to enable the background fetch loop.
# [weather]
# latitude = 37.77
# longitude = -122.41
# unit = "F"        # "F" or "C"
# interval_seconds = 600
