<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip-Disc Controller</title>
  <link rel="stylesheet" href="/static/styles.css?v=5" />
</head>
<body>
  <div class="header">
    <h1>🎮 Flip-Disc Controller</h1>
    <p>Control animations and preview frames</p>
  </div>

  <div class="status-grid">
    <div class="status-card">
      <h3>Status</h3>
      <div><strong>Running:</strong> <span id="running">-</span></div>
      <div><strong>Connected:</strong> <span id="connected">-</span></div>
      <div><strong>FPS:</strong> <span id="fps">-</span></div>
      <div><strong>Frames Presented:</strong> <span id="presented">-</span></div>
      <div><strong>Animation:</strong> <span id="current-anim">-</span></div>
      <div id="last-error" style="color: #b00020;"></div>
    </div>

    <div class="status-card">
      <h3>Display</h3>
      <div><strong>Size:</strong> <span id="size">-</span></div>
      <div><strong>Buffer:</strong> <span id="buffer">-</span></div>
    </div>
  </div>

  <div class="controls-grid">
    <div class="controls status-card">
      <h3>Controls</h3>
      <div style="margin-bottom:8px;">
        <label for="anim"><strong>Animation:</strong></label>
        <select id="anim"></select>
        <button class="button" id="start">Start</button>
        <button class="button" id="stop">Stop</button>
      </div>
      <div>
        <label for="fps-input"><strong>FPS:</strong></label>
        <input id="fps-input" type="number" min="1" max="60" step="1" value="20" style="width:80px;" />
        <button class="button" id="set-fps">Set FPS</button>
        <button class="button" id="refresh">Refresh Status</button>
      </div>
      <div id="animation-params" style="margin-top: 16px; border-top: 1px solid #ddd; padding-top: 12px;">
        <h4 style="margin: 0 0 8px 0;">Animation Parameters</h4>
        <div id="params-container"></div>
        <div id="param-error" style="color: #b00020; margin-top: 8px;"></div>
      </div>
    </div>

    <div class="status-card">
      <h3>Preview</h3>
      <canvas id="preview" class="preview-canvas" width="280" height="280"></canvas>
      <div id="game-controls" class="game-controls" hidden>
        <h4>Game controls</h4>
        <table id="game-controls-table"></table>
        <div id="game-error" class="game-error"></div>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=6"></script>
</body>
</html>
